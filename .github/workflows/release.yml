name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Build EXE (onedir)
        run: uv run pyinstaller --noconfirm --clean --onedir --console --name "天翼云用量监视器" --paths . run.py

      - name: Build EXE (onefile)
        run: uv run pyinstaller --noconfirm --clean --onefile --console --name "天翼云用量监视器" --paths . run.py

      - name: Zip onedir
        run: Compress-Archive -Path "dist/天翼云用量监视器/*" -DestinationPath "dist/天翼云用量监视器-windows-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 天翼云用量监视器
          path: |
            dist/天翼云用量监视器-windows-x64.zip
            dist/天翼云用量监视器.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/天翼云用量监视器-windows-x64.zip
            dist/天翼云用量监视器.exe
          generate_release_notes: true
